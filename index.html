<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce ball</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>

<body class="container">

    <marquee class="balling" behavior="alternate" scrollamount="1">
        <marquee behavior="alternate" direction="down" scrollamount="5">
            <div class="ball1 ball"></div>
        </marquee>
    </marquee>

    <marquee class="balling" behavior="alternate" scrollamount="5">
        <marquee behavior="alternate" direction="down" scrollamount="1">
            <div class="ball2 ball"></div>
        </marquee>
    </marquee>

    <marquee class="balling" behavior="alternate" scrollamount="2">
        <marquee behavior="alternate" direction="down" scrollamount="4">
            <div class="ball3 ball"></div>
        </marquee>
    </marquee>

    <marquee class="balling" behavior="alternate" scrollamount="4">
        <marquee behavior="alternate" direction="down" scrollamount="2">
            <div class="ball4 ball"></div>
        </marquee>
    </marquee>

    <marquee class="balling" behavior="alternate" scrollamount="3">
        <marquee behavior="alternate" direction="down" scrollamount="6">
            <div class="ball1 ball"></div>
        </marquee>
    </marquee>

    <marquee class="balling" behavior="alternate" scrollamount="6">
        <marquee behavior="alternate" direction="down" scrollamount="3">
            <div class="ball2 ball"></div>
        </marquee>
    </marquee>

    <marquee class="balling" behavior="alternate" scrollamount="1">
        <marquee behavior="alternate" direction="down" scrollamount="7">
            <div class="ball3 ball"></div>
        </marquee>
    </marquee>

    <marquee class="balling" behavior="alternate" scrollamount="7">
        <marquee behavior="alternate" direction="down" scrollamount="1">
            <div class="ball4 ball"></div>
        </marquee>
    </marquee>

</body>

</html>
